name: Wake Streamlit Apps

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake apps and log results
        run: |
          python - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright
          from datetime import datetime

          URLS = [
              "https://insurance-churn-predictions.streamlit.app/",
              "https://vahousing-price-predictor.streamlit.app/",
              "https://collegehappiness.streamlit.app/",
              "https://us-cities-dashboard.streamlit.app/",
              "https://movie-match-ai.streamlit.app/",
          ]

          async def wake():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  results = []

                  for url in URLS:
                      page = await browser.new_page()
                      try:
                          await page.goto(url, wait_until="domcontentloaded", timeout=60000)

                          wake_btn = await page.query_selector("text=Yes, get this app back up!")
                          if not wake_btn:
                              wake_btn = await page.query_selector("button:has-text('get this app')")

                          if wake_btn:
                              await wake_btn.click()
                              results.append(("SLEEPING", url))
                          else:
                              results.append(("AWAKE", url))

                      except Exception as e:
                          results.append(("ERROR", f"{url} — {e}"))
                      await page.close()

                  await browser.close()

                  sleeping = [r for r in results if r[0] == "SLEEPING"]
                  awake    = [r for r in results if r[0] == "AWAKE"]
                  errors   = [r for r in results if r[0] == "ERROR"]

                  lines = []
                  lines.append("=" * 60)
                  lines.append(f"  Run: {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}")
                  lines.append(f"  Awake: {len(awake)}  |  Sleeping: {len(sleeping)}  |  Errors: {len(errors)}")
                  lines.append("=" * 60)
                  for status, url in results:
                      icon = "OK" if status == "AWAKE" else "ZZ" if status == "SLEEPING" else "!!"
                      lines.append(f"  [{icon}] {status:<8} {url}")
                  lines.append("=" * 60)
                  lines.append("")

                  entry = "\n".join(lines)

                  # print to Actions log
                  print(entry)

                  # append to persistent log file (newest at top)
                  try:
                      with open("wake_log.txt", "r") as f:
                          existing = f.read()
                  except FileNotFoundError:
                      existing = ""

                  with open("wake_log.txt", "w") as f:
                      f.write(entry + existing)

          asyncio.run(wake())
          EOF

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wake_log.txt
          git diff --cached --quiet || git commit -m "chore: update wake log $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
