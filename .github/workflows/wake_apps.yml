name: Wake Streamlit Apps

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake apps and log results
        run: |
          python - <<'EOF'
          import asyncio
          import csv
          import os
          from playwright.async_api import async_playwright
          from datetime import datetime

          APPS = [
              ("insurance_churn",    "https://insurance-churn-predictions.streamlit.app/"),
              ("va_housing",         "https://vahousing-price-predictor.streamlit.app/"),
              ("college_happiness",  "https://collegehappiness.streamlit.app/"),
              ("us_cities",          "https://us-cities-dashboard.streamlit.app/"),
              ("movie_match",        "https://movie-match-ai.streamlit.app/"),
          ]

          COLUMNS = ["timestamp"] + [name for name, _ in APPS]
          LOG_FILE = "wake_log.csv"

          async def wake():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  row = {"timestamp": datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")}

                  for name, url in APPS:
                      page = await browser.new_page()
                      try:
                          await page.goto(url, wait_until="domcontentloaded", timeout=60000)

                          wake_btn = await page.query_selector("text=Yes, get this app back up!")
                          if not wake_btn:
                              wake_btn = await page.query_selector("button:has-text('get this app')")

                          if wake_btn:
                              await wake_btn.click()
                              row[name] = 0   # was sleeping
                          else:
                              row[name] = 1   # already awake

                      except Exception:
                          row[name] = -1      # error / unreachable
                      await page.close()

                  await browser.close()

                  # print summary to Actions log
                  print(f"\nRun: {row['timestamp']}")
                  for name, url in APPS:
                      status = {1: "AWAKE", 0: "SLEEPING", -1: "ERROR"}[row[name]]
                      print(f"  {status:<8} {url}")

                  # write header if file doesn't exist yet
                  write_header = not os.path.exists(LOG_FILE)
                  with open(LOG_FILE, "a", newline="") as f:
                      writer = csv.DictWriter(f, fieldnames=COLUMNS)
                      if write_header:
                          writer.writeheader()
                      writer.writerow(row)

          asyncio.run(wake())
          EOF

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wake_log.csv
          git diff --cached --quiet || git commit -m "chore: update wake log $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
